name: Validate, Attest, Sign, Tag, and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v3.3.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be created from main."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

          if git show-ref \
            --verify \
            --quiet \
            "refs/tags/${VERSION}"; then
            echo "Tag already exists: ${VERSION}"
            exit 1
          fi

  trusted-build:
    name: Trusted build and provenance
    needs: preflight

    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    uses: williamveith/fbs-interlock-gateway-builder/.github/workflows/build-release.yml@77ebf8f3386b18016fccba58fe2e93e69be25f4b

    with:
      version: ${{ inputs.version }}

  publish:
    name: Verify provenance, authorize update, sign, and publish
    needs:
      - preflight
      - trusted-build

    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download trusted release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-release-${{ github.sha }}
          path: build/release

      - name: Restore executable permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 \
            build/release/fbs-interlock-gateway-linux-amd64 \
            build/release/fbs-interlock-gateway-linux-arm64 \
            build/release/fbs-interlock-gateway-darwin-amd64 \
            build/release/fbs-interlock-gateway-darwin-arm64

      - name: Require publishing tools
        shell: bash
        run: |
          set -euo pipefail

          commands=(
            gh
            openssl
            sha256sum
          )

          for command_name in "${commands[@]}"; do
            if ! command -v "${command_name}" >/dev/null 2>&1; then
              echo "Required command is unavailable: ${command_name}"
              exit 1
            fi
          done

      - name: Verify release checksums
        working-directory: build/release
        shell: bash
        run: |
          set -euo pipefail

          sha256sum --check fbs-interlock-gateway-linux-amd64.sha256
          sha256sum --check fbs-interlock-gateway-linux-arm64.sha256
          sha256sum --check fbs-interlock-gateway-windows-amd64.exe.sha256
          sha256sum --check fbs-interlock-gateway-darwin-arm64.sha256
          sha256sum --check fbs-interlock-gateway-darwin-amd64.sha256

      - name: Verify SLSA provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_SHA: 77ebf8f3386b18016fccba58fe2e93e69be25f4b
        run: |
          set -euo pipefail

          signer_workflow="williamveith/fbs-interlock-gateway-builder/.github/workflows/build-release.yml"

          files=(
            "build/release/fbs-interlock-gateway-linux-amd64"
            "build/release/fbs-interlock-gateway-linux-amd64.sha256"
            "build/release/fbs-interlock-gateway-linux-arm64"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256"
            "build/release/fbs-interlock-gateway-windows-amd64.exe"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256"
            "build/release/fbs-interlock-gateway-darwin-arm64"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256"
            "build/release/fbs-interlock-gateway-darwin-amd64"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256"
          )

          for file in "${files[@]}"; do
            echo "Verifying provenance: ${file}"

            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --signer-digest "${BUILDER_SHA}" \
              --source-ref "refs/heads/main" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners
          done

      - name: Sign authenticated update checksums
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${UPDATE_SIGNING_PRIVATE_KEY}" ]]; then
            echo "UPDATE_SIGNING_PRIVATE_KEY is not configured in the release environment."
            exit 1
          fi

          private_key="${RUNNER_TEMP}/update-signing-private.pem"
          public_key="${RUNNER_TEMP}/update-signing-public.pem"

          umask 077
          printf '%s' "${UPDATE_SIGNING_PRIVATE_KEY}" > "${private_key}"

          trap 'rm -f "${private_key}" "${public_key}"' EXIT

          openssl pkey \
            -in "${private_key}" \
            -pubout \
            -out "${public_key}"

          checksums=(
            "build/release/fbs-interlock-gateway-linux-amd64.sha256"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256"
          )

          for checksum in "${checksums[@]}"; do
            signature="${checksum}.sig"

            echo "Signing ${checksum}"

            openssl pkeyutl \
              -sign \
              -rawin \
              -inkey "${private_key}" \
              -in "${checksum}" \
              -out "${signature}"

            test "$(wc -c < "${signature}" | tr -d ' ')" -eq 64

            openssl pkeyutl \
              -verify \
              -rawin \
              -pubin \
              -inkey "${public_key}" \
              -in "${checksum}" \
              -sigfile "${signature}"
          done

      - name: Verify embedded updater trust key
        shell: bash
        run: |
          set -euo pipefail

          binary="build/release/fbs-interlock-gateway-linux-amd64"
          checksum="${binary}.sha256"
          signature="${checksum}.sig"
          asset="$(basename "${binary}")"

          expected="$(
            awk 'NF >= 1 { print tolower($1); exit }' "${checksum}"
          )"

          verified="$(
            "${binary}" verify-update-checksum \
              --checksum "${checksum}" \
              --signature "${signature}" \
              --asset "${asset}"
          )"

          if [[ "${verified}" != "${expected}" ]]; then
            echo "Embedded update verifier returned the wrong checksum."
            echo "Expected: ${expected}"
            echo "Received: ${verified}"
            exit 1
          fi

          echo "Embedded updater trust key verified."

      - name: Import release-signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}
          git_user_signingkey: true
          git_tag_gpgsign: true
          git_committer_name: ${{ vars.GIT_COMMITTER_NAME }}
          git_committer_email: ${{ vars.GIT_COMMITTER_EMAIL }}

      - name: Create, verify, and push signed tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git show-ref \
            --verify \
            --quiet \
            "refs/tags/${VERSION}"; then
            echo "Tag now exists: ${VERSION}"
            exit 1
          fi

          git tag \
            --sign "${VERSION}" \
            --message "Release ${VERSION}" \
            "${GITHUB_SHA}"

          echo "Verifying tag signature..."
          git verify-tag "${VERSION}"

          git push origin "refs/tags/${VERSION}"

      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "${VERSION}" \
            build/release/fbs-interlock-gateway-linux-amd64 \
            build/release/fbs-interlock-gateway-linux-amd64.sha256 \
            build/release/fbs-interlock-gateway-linux-amd64.sha256.sig \
            build/release/fbs-interlock-gateway-linux-arm64 \
            build/release/fbs-interlock-gateway-linux-arm64.sha256 \
            build/release/fbs-interlock-gateway-linux-arm64.sha256.sig \
            build/release/fbs-interlock-gateway-windows-amd64.exe \
            build/release/fbs-interlock-gateway-windows-amd64.exe.sha256 \
            build/release/fbs-interlock-gateway-windows-amd64.exe.sha256.sig \
            build/release/fbs-interlock-gateway-darwin-arm64 \
            build/release/fbs-interlock-gateway-darwin-arm64.sha256 \
            build/release/fbs-interlock-gateway-darwin-arm64.sha256.sig \
            build/release/fbs-interlock-gateway-darwin-amd64 \
            build/release/fbs-interlock-gateway-darwin-amd64.sha256 \
            build/release/fbs-interlock-gateway-darwin-amd64.sha256.sig \
            --verify-tag \
            --generate-notes \
            --title "${VERSION}"

      - name: Verify published immutable release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          release_verified=0

          for attempt in {1..12}; do
            if gh release verify "${VERSION}" \
              --repo "${GITHUB_REPOSITORY}"; then
              release_verified=1
              break
            fi

            echo "Release attestation is not available yet; retrying..."
            sleep 5
          done

          if [[ "${release_verified}" -ne 1 ]]; then
            echo "ERROR: Immutable release attestation verification failed."
            exit 1
          fi

          files=(
            "build/release/fbs-interlock-gateway-linux-amd64"
            "build/release/fbs-interlock-gateway-linux-amd64.sha256"
            "build/release/fbs-interlock-gateway-linux-amd64.sha256.sig"
            "build/release/fbs-interlock-gateway-linux-arm64"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256"
            "build/release/fbs-interlock-gateway-linux-arm64.sha256.sig"
            "build/release/fbs-interlock-gateway-windows-amd64.exe"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256"
            "build/release/fbs-interlock-gateway-windows-amd64.exe.sha256.sig"
            "build/release/fbs-interlock-gateway-darwin-arm64"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256"
            "build/release/fbs-interlock-gateway-darwin-arm64.sha256.sig"
            "build/release/fbs-interlock-gateway-darwin-amd64"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256"
            "build/release/fbs-interlock-gateway-darwin-amd64.sha256.sig"
          )

          for file in "${files[@]}"; do
            echo "Verifying immutable release asset: ${file}"

            gh release verify-asset \
              "${VERSION}" \
              "${file}" \
              --repo "${GITHUB_REPOSITORY}"
          done